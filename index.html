<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国标麻将算番器</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🀄</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>🀄 国标麻将算番器</h1>
        </header>

        <main>
            <!-- 结果显示区域 -->
            <section class="result-panel">
                <div class="total-score">
                    <span class="label">总番数</span>
                    <span class="score" id="totalScore">0</span>
                    <span class="fan">番</span>
                </div>
                <div class="detected-fans" id="detectedFans">
                    <p class="placeholder">请在下方输入你的牌型</p>
                </div>
            </section>

            <!-- 计算按钮 -->
            <section class="calculate-section">
                <button class="calculate-btn" id="calculateBtn">🧮 计算番数</button>
            </section>

            <!-- 手牌显示区域 -->
            <section class="hand-section">
                <div class="section-title-row">
                    <h2>📋 当前手牌 <span class="tile-count">(<span id="handCount">0</span>/14)</span></h2>
                    <button class="section-title-btn clear-hand" id="clearHand" title="清空手牌">🗑️ 清空</button>
                </div>
                <div class="hand-display" id="handDisplay">
                    <p class="placeholder">点击选择麻将牌</p>
                </div>
                <div class="win-tile-section">
                    <label>🎯 和牌:</label>
                    <div class="win-tile-display" id="winTileDisplay">
                        <span class="placeholder">未选择</span>
                    </div>
                    <button class="action-btn select-win" id="selectWinTile">选择和牌</button>
                    <button class="action-btn clear-win" id="clearWinTile">清除</button>
                </div>
            </section>

            <!-- 副露区域 -->
            <section class="melds-section">
                <div class="section-title-row">
                    <h2>🔲 副露 (吃/碰/杠)</h2>
                    <button class="section-title-btn clear-melds" id="clearMelds" title="清空副露">🗑️ 清空</button>
                </div>
                <div class="melds-display" id="meldsDisplay" title="点击添加副露">
                    <p class="placeholder">点击选择副露（吃/碰/杠）</p>
                </div>
            </section>

            <!-- 和牌条件 -->
            <section class="conditions-section">
                <h2>⚙️ 和牌条件</h2>
                <div class="conditions-grid">
                    <div class="condition-item">
                        <label>和牌方式</label>
                        <div class="win-type-radio">
                            <label class="radio-label">
                                <input type="radio" name="winType" value="dianhe" checked>
                                <span>点和</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="winType" value="zimo">
                                <span>自摸</span>
                            </label>
                        </div>
                    </div>
                    <div class="condition-item">
                        <label>圈风</label>
                        <select id="prevalentWind">
                            <option value="none">无</option>
                            <option value="east">东</option>
                            <option value="south">南</option>
                            <option value="west">西</option>
                            <option value="north">北</option>
                        </select>
                    </div>
                    <div class="condition-item">
                        <label>门风</label>
                        <select id="seatWind">
                            <option value="none">无</option>
                            <option value="east">东</option>
                            <option value="south">南</option>
                            <option value="west">西</option>
                            <option value="north">北</option>
                        </select>
                    </div>
                    <div class="condition-item">
                        <label>花牌数</label>
                        <select id="flowerCount">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                        </select>
                    </div>
                </div>
                <div class="special-conditions">
                    <label class="checkbox-label">
                        <input type="checkbox" id="isLastTile">
                        <span>海底/河底 (最后一张)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="isKongDraw">
                        <span>杠上开花/抢杠和</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="isJuezhang">
                        <span>绝张</span>
                    </label>
                </div>
            </section>

            <!-- 番种参考 -->
            <section class="rules-section">
                <h2>📖 番种参考</h2>
                <div class="rules-content" id="rulesContent">
                <!-- 此处内容将通过 JavaScript 根据 FANS_DATA 动态生成 -->
                </div>
            </section>
        </main>

        <footer>
            <p>© 2026 国标麻将算番器 | 仅供学习参考</p>
        </footer>
    </div>

    <!-- 通用选牌弹窗 (用于添加手牌) -->
    <div class="modal" id="tileSelectorModal">
        <div class="modal-content modal-content-wide">
            <div class="modal-header">
                <h3 id="tileSelectorTitle">选择麻将牌</h3>
                <button class="modal-close" id="tileSelectorClose">✕</button>
            </div>
            <div class="modal-body modal-body-no-scroll">
                <p id="tileSelectorInstruction" class="modal-instruction">点击麻将牌添加，点击预览区牌移除</p>
                <div class="selected-preview" id="selectedHandPreview">
                    <span class="selected-preview-label">已选:</span>
                    <div class="selected-preview-tiles" id="selectedHandTiles"></div>
                </div>
                <div class="selector-tiles selector-tiles-inline" id="selectorTiles"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" id="tileSelectorCancel">清空已选</button>
                <button class="modal-btn confirm" id="tileSelectorDone">完成</button>
            </div>
        </div>
    </div>

    <!-- 副露输入弹窗（自动成组模式） -->
    <div class="modal" id="meldModal">
        <div class="modal-content modal-content-wide">
            <div class="modal-header">
                <h3 id="modalTitle">添加副露（自动成组）</h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body modal-body-scroll">
                <p id="modalInstruction" class="modal-instruction">3张顺子直接成「吃」；3张相同成「碰」；4张相同成「杠」，杠选中后可切明/暗</p>
                <div class="selected-preview" id="selectedMeldPreview">
                    <span class="selected-preview-label">当前输入（单牌）:</span>
                    <div class="selected-preview-tiles" id="selectedMeldTiles"></div>
                </div>
                <div class="melds-preview-groups" id="meldGroupsPreview">
                    <div class="melds-preview-label">当前副露（点击选中/删除，杠可切明暗）：</div>
                    <div class="melds-preview-list" id="meldGroupsPreviewList">
                        <span class="preview-empty">暂无副露</span>
                    </div>
                </div>
                <div class="gang-switcher" id="gangSwitcher" style="display:none;">
                    <span class="gang-switcher-label">选中杠类型：</span>
                    <label class="radio-label">
                        <input type="radio" name="gangType" value="minggang" id="gangMingRadio">
                        <span>明杠</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="gangType" value="angang" id="gangAnRadio">
                        <span>暗杠</span>
                    </label>
                </div>
                <br/>
                <div class="selector-tiles selector-tiles-inline" id="modalTiles"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" id="modalCancel">清空輸入</button>
                <button class="modal-btn confirm" id="modalConfirm">确认添加</button>
            </div>
        </div>
    </div>

    <script src="tiles.js"></script>
    <script src="fans.js"></script>
    <script src="analyzer.js"></script>
    <script src="app.js"></script>
</body>
</html>
