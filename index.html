<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国标麻将算番器</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🀄</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>🀄 国标麻将算番器</h1>
            <p class="subtitle">输入你的牌，自动计算番数</p>
        </header>

        <main>
            <!-- 结果显示区域 -->
            <section class="result-panel">
                <div class="total-score">
                    <span class="label">总番数</span>
                    <span class="score" id="totalScore">0</span>
                    <span class="fan">番</span>
                </div>
                <div class="detected-fans" id="detectedFans">
                    <p class="placeholder">请在下方输入你的牌型</p>
                </div>
            </section>

            <!-- 计算按钮 -->
            <section class="calculate-section">
                <button class="calculate-btn" id="calculateBtn">🧮 计算番数</button>
            </section>

            <!-- 手牌显示区域 -->
            <section class="hand-section">
                <h2>📋 当前手牌 <span class="tile-count">(<span id="handCount">0</span>/14)</span></h2>
                <div class="hand-display" id="handDisplay">
                    <p class="placeholder">点击下方麻将牌添加到手牌</p>
                </div>
                <div class="win-tile-section">
                    <label>🎯 和牌:</label>
                    <div class="win-tile-display" id="winTileDisplay">
                        <span class="placeholder">未选择</span>
                    </div>
                    <button class="action-btn select-win" id="selectWinTile">选择和牌</button>
                    <button class="action-btn clear-win" id="clearWinTile">清除</button>
                </div>
                <div class="hand-actions">
                    <button class="action-btn clear-hand" id="clearHand">🗑️ 清空手牌</button>
                    <button class="action-btn undo-btn" id="undoTile">↩️ 撤销</button>
                </div>
            </section>

            <!-- 副露区域 -->
            <section class="melds-section">
                <h2>🔲 副露 (吃/碰/杠)</h2>
                <div class="melds-display" id="meldsDisplay">
                    <p class="placeholder">点击下方按钮添加副露</p>
                </div>
                <div class="meld-actions">
                    <button class="meld-btn" id="addChi">➕ 吃</button>
                    <button class="meld-btn" id="addPong">➕ 碰</button>
                    <button class="meld-btn" id="addMingGang">➕ 明杠</button>
                    <button class="meld-btn" id="addAnGang">➕ 暗杠</button>
                    <button class="meld-btn clear-melds" id="clearMelds">🗑️ 清空副露</button>
                </div>
            </section>

            <!-- 和牌条件 -->
            <section class="conditions-section">
                <h2>⚙️ 和牌条件</h2>
                <div class="conditions-grid">
                    <div class="condition-item">
                        <label>和牌方式</label>
                        <select id="winType">
                            <option value="zimo">自摸</option>
                            <option value="dianhe">点和</option>
                        </select>
                    </div>
                    <div class="condition-item">
                        <label>圈风</label>
                        <select id="prevalentWind">
                            <option value="east">无</option>
                            <option value="east">东</option>
                            <option value="south">南</option>
                            <option value="west">西</option>
                            <option value="north">北</option>
                        </select>
                    </div>
                    <div class="condition-item">
                        <label>门风</label>
                        <select id="seatWind">
                            <option value="east">无</option>
                            <option value="east">东</option>
                            <option value="south">南</option>
                            <option value="west">西</option>
                            <option value="north">北</option>
                        </select>
                    </div>
                    <div class="condition-item">
                        <label>花牌数</label>
                        <select id="flowerCount">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                        </select>
                    </div>
                </div>
                <div class="special-conditions">
                    <label class="checkbox-label">
                        <input type="checkbox" id="isLastTile">
                        <span>海底/河底 (最后一张)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="isKongDraw">
                        <span>杠上开花/抢杠和</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="isJuezhang">
                        <span>绝张</span>
                    </label>
                </div>
            </section>

            <!-- 选牌区域 -->
            <section class="tile-selector">
                <h2>🀄 选择麻将牌</h2>
                
                <div class="tile-group">
                    <h3>万 (Characters)</h3>
                    <div class="tiles-row" id="wanTiles"></div>
                </div>
                
                <div class="tile-group">
                    <h3>条 (Bamboo)</h3>
                    <div class="tiles-row" id="tiaoTiles"></div>
                </div>
                
                <div class="tile-group">
                    <h3>饼 (Dots)</h3>
                    <div class="tiles-row" id="bingTiles"></div>
                </div>
                
                <div class="tile-group">
                    <h3>风牌 (Winds)</h3>
                    <div class="tiles-row" id="windTiles"></div>
                </div>
                
                <div class="tile-group">
                    <h3>箭牌 (Dragons)</h3>
                    <div class="tiles-row" id="dragonTiles"></div>
                </div>
            </section>

            <!-- 番种参考 -->
            <section class="rules-section">
                <h2>📖 番种参考</h2>
                <div class="rules-content" id="rulesContent">
                <!-- 此处内容将通过 JavaScript 根据 FANS_DATA 动态生成 -->
                </div>
            </section>
        </main>

        <footer>
            <p>© 2026 国标麻将算番器 | 仅供学习参考</p>
        </footer>
    </div>

    <!-- 副露输入弹窗 -->
    <div class="modal" id="meldModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加副露</h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body">
                <p id="modalInstruction">请选择牌</p>
                <div class="modal-tiles" id="modalTiles"></div>
                <div class="selected-meld-tiles" id="selectedMeldTiles"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" id="modalCancel">取消</button>
                <button class="modal-btn confirm" id="modalConfirm">确认</button>
            </div>
        </div>
    </div>

    <script src="tiles.js"></script>
    <script src="fans.js"></script>
    <script src="analyzer.js"></script>
    <script src="app.js"></script>
</body>
</html>
